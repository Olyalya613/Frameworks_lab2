spring.application.name=Book Catalog Spring Boot
server.port=7070
catalog.owner=Student
catalog.welcome-message=Spring IoC and DI are working!
logging.level.sumdu.edu.ua.spring=INFO

spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Lab 7: FreeMarker for email only; Thymeleaf still renders the website.
spring.freemarker.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
bookapp.mail.enabled=${BOOKAPP_MAIL_ENABLED:false}
bookapp.mail.to=${BOOKAPP_MAIL_TO:}
# Upload static/img/logo.png to your GitHub branch and set a raw URL here.
bookapp.mail.logo-url=${BOOKAPP_LOGO_URL:}

# Lab 8: separate H2 database (not the old JDBC file)
spring.datasource.url=jdbc:h2:file:./data/catalog-lab8;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
