<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вхід до каталогу</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="wrap narrow">
    <div class="panel">
        <h1>Вхід до каталогу</h1>
        
    <p th:if="${param.error}" class="error">Неправильний логін або пароль.</p>
    <p th:if="${param.logout}" class="success">Ви вийшли з облікового запису.</p>
    <p th:if="${param.registered}" class="success">Акаунт створено. Увійдіть до каталогу.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">Логін</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Пароль</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Увійти</button>
    </form>
    <p><a th:href="@{/register}">Зареєструватися</a></p>
    </div>
</main>
</body>
</html>
