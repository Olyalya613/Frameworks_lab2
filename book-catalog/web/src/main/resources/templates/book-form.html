<!DOCTYPE html><html lang="uk" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{form.add}">Add book</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="wrap narrow"><div class="panel"><p class="eyebrow">FORM BINDING</p><h1 th:text="#{form.add}">Add book</h1><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/books/add}" th:object="${book}" method="post"><label th:text="#{book.title}">Title</label><input th:field="*{title}" required maxlength="255"><label th:text="#{book.author}">Author</label><input th:field="*{author}" required maxlength="255"><label th:text="#{book.year}">Year</label><input type="number" th:field="*{year}" min="1" max="2100" required><div class="actions"><button class="btn" type="submit" th:text="#{form.save}">Save</button><a class="link" th:href="@{/books}" th:text="#{form.cancel}">Cancel</a></div></form></div></main></body></html>
