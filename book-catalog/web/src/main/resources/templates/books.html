<!DOCTYPE html><html lang="uk" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{books.title}">Books</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="wrap"><section class="hero"><div><p class="eyebrow">SPRING MVC + THYMELEAF</p><h1 th:text="#{books.title}">Book catalog</h1><p th:text="#{books.subtitle}">Server-side rendered catalog</p></div><a class="btn" th:href="@{/books/add}" th:text="#{form.add}">Add book</a></section><div class="success" th:if="${success}" th:text="#{book.saved}">Saved</div><div class="success" th:if="${mailStatus}" th:text="${mailStatus}"></div><form class="search" method="get" th:action="@{/books}"><input name="q" th:value="${q}" th:placeholder="#{search.placeholder}"><button th:text="#{search.button}">Search</button></form><div class="empty" th:if="${#lists.isEmpty(books)}" th:text="#{books.empty}">No books</div><div class="grid" th:unless="${#lists.isEmpty(books)}"><article class="card" th:each="book : ${books}"><span class="year" th:text="${book.year}">2026</span><h2><a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Title</a></h2><p th:text="${book.author}">Author</p><small>#<span th:text="${book.id}">1</span></small></article></div><section class="wrap"><h2>Коментарі користувачів</h2><p>Оберіть користувача: <a href="/users/1/comments">Olha</a> · <a href="/users/2/comments">Anna</a> · <a href="/users/3/comments">Max</a></p></section></main></body></html>
