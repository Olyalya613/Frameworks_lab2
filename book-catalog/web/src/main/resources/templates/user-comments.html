<!DOCTYPE html><html lang="uk" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Коментарі користувача</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="wrap"><section class="hero"><div><p class="eyebrow">SPRING DATA JPA + FLYWAY</p><h1>Коментарі користувача: <span th:text="${username}">Olha</span></h1><p>Усі коментарі обраного користувача</p></div><a class="btn" th:href="@{/books}">До каталогу</a></section><div class="empty" th:if="${#lists.isEmpty(comments)}">У цього користувача ще немає коментарів.</div><div class="grid" th:unless="${#lists.isEmpty(comments)}"><article class="card" th:each="c : ${comments}"><span class="year" th:text="${c.createdAt}">Дата</span><p th:text="${c.text}">Текст</p><p>Книга: <a th:href="@{/books/{id}(id=${c.bookId})}" th:text="${c.bookTitle}">Книга</a></p></article></div><p>Інші користувачі: <a th:each="u : ${users}" th:href="@{/users/{id}/comments(id=${u.id})}" th:text="${u.username} + '  '">User</a></p></main></body></html>
