<!DOCTYPE html><html lang="uk" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Коментарі книги</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="wrap"><section class="hero"><div><p class="eyebrow">BOOK DETAILS</p><h1 th:text="${book.title}">Книга</h1><p><span th:text="${book.author}">Автор</span> · <span th:text="${book.year}">Рік</span></p></div><a class="btn" th:href="@{/books}">До каталогу</a></section><div class="success" th:if="${commentSuccess}" th:text="${commentSuccess}"></div><div class="empty" th:if="${commentError}" th:text="${commentError}"></div><section class="card" style="max-width:680px;margin-bottom:22px"><h2>Додати коментар</h2><form method="post" th:action="@{/books/{id}/comments(id=${book.id})}"><label>Користувач <select name="author" required><option th:each="u : ${users}" th:value="${u.username}" th:text="${u.username}"></option></select></label><label>Коментар <textarea name="text" required maxlength="1000" rows="4" style="width:100%"></textarea></label><button class="btn" type="submit">Додати коментар</button></form></section><h2>Коментарі книги</h2><div class="empty" th:if="${#lists.isEmpty(comments)}">Коментарів ще немає.</div><div class="grid"><article class="card" th:each="c : ${comments}"><strong th:text="${c.author}">Автор</strong><p th:text="${c.text}">Текст</p><small th:text="${c.createdAt}">Дата</small></article></div></main></body></html>
